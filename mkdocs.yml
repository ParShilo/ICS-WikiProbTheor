site_name: Теория вероятностей — ICS Wiki
site_url: https://ParShilo.github.io/ICS-WikiProbTheor/
repo_url: https://github.com/ParShilo/ICS-WikiProbTheor

theme:
  name: material
  language: ru
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Светлая тема
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Тёмная тема
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - search.highlight

nav:
  - Основные понятия:
    - Пространство элементарных исходов: Основные понятия/Пространство элементарных исходов.md
    - Случайный эксперимент: Основные понятия/Случайный эксперимент.md
    - Случайное событие:
      - Случайное событие: Основные понятия/Случайное событие/Случайное событие.md
      - Следствие случайного события: Основные понятия/Случайное событие/Следствие случайного события.md
      - Несовместные и совместные события: Основные понятия/Случайное событие/Несовместные и совместные события.md
    - Определения вероятности:
      - Классическое: Основные понятия/Определения вероятности/Классическое определение вероятности.md
      - Геометрическое: Основные понятия/Определения вероятности/Геометрическое определение вероятности.md
      - Статистическое: Основные понятия/Определения вероятности/Статистическое определение вероятности.md
      - Аксиоматическое: Основные понятия/Определения вероятности/Аксиоматическое определение вероятности.md
      - Сигма-алгебра событий: Основные понятия/Определения вероятности/Сигма-алгебра событий.md
    - Условная вероятность:
      - Условная вероятность: Основные понятия/Условная вероятность/Условная вероятность.md
      - Формула умножения: Основные понятия/Условная вероятность/Формула умножения вероятностей.md
      - Независимые события: Основные понятия/Условная вероятность/Независимые события.md
      - Попарная независимость: Основные понятия/Условная вероятность/Попарная независимость.md
      - Независимость в совокупности: Основные понятия/Условная вероятность/Независимость в совокупности.md
    - Полная вероятность:
      - Полная группа событий: Основные понятия/Полная вероятность/Полная группа событий.md
      - Формула полной вероятности: Основные понятия/Полная вероятность/Формула полной вероятности.md
      - Формула Байеса: Основные понятия/Полная вероятность/Формула Байеса.md
      - Схема испытаний Бернулли: Основные понятия/Полная вероятность/Схема испытаний Бернулли.md
      - Теорема Бернулли: Основные понятия/Полная вероятность/Теорема Бернулли.md
  - Вопросы к РК2: Вопросы РК2.md

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - toc:
      permalink: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
